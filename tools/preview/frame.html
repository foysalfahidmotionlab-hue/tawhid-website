<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=block" rel="stylesheet">
<!-- Desktop-monitor mockup. Open as frame.html?img=<path>&n=<label>&t=<title>&s=<swatch hexes, comma-separated> -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1200px;overflow:hidden;font-family:'DM Sans',sans-serif;
 background:radial-gradient(ellipse 70% 60% at 50% 40%,#f6f1e5 0%,#e6dfcf 60%,#d8cfbb 100%);display:flex;flex-direction:column;align-items:center}
.cap{margin-top:30px;display:flex;align-items:center;gap:18px;color:#1d1d1b}
.cap b{font:300 40px Fraunces;letter-spacing:-.02em}
.cap span{font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:#94721f;font-weight:600}
.sw{display:flex;gap:6px;margin-left:10px}.sw i{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.2)}
.mon{margin-top:22px;position:relative}
.bezel{background:#0f1110;border-radius:26px;padding:20px 20px 0;box-shadow:0 60px 90px -40px rgba(30,25,10,.55),0 0 0 2px #2a2c2b inset}
.screen{width:1392px;border-radius:8px;overflow:hidden;background:#fff}
.bar{height:44px;background:#ecebe7;display:flex;align-items:center;padding:0 18px;gap:9px;border-bottom:1px solid #d9d7d0;position:relative}
.bar i{width:12px;height:12px;border-radius:50%;display:block}
.tabt{margin-left:22px;height:30px;padding:0 18px;background:#fff;border-radius:9px 9px 0 0;align-self:flex-end;display:flex;align-items:center;gap:8px;font-size:12px;color:#333;min-width:230px}
.tabt em{width:14px;height:14px;border-radius:50%;background:#0f4228;display:block}
.url{position:absolute;left:50%;transform:translateX(-50%);height:28px;width:520px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#555;border:1px solid #dcdad3}
.shot{display:block;width:1392px;height:870px;object-fit:cover;object-position:top}
.chin{height:46px;display:grid;place-items:center;color:#5b5f5c;font:500 12px 'DM Sans';letter-spacing:.3em}
.neck{width:220px;height:74px;margin:0 auto;background:linear-gradient(90deg,#bfbcb4,#e7e5df 45%,#cfccc4);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}
.base{width:440px;height:20px;margin:0 auto;border-radius:6px 6px 14px 14px;background:linear-gradient(#e9e7e1,#bdbab2);box-shadow:0 26px 30px -14px rgba(30,25,10,.45)}
</style></head><body>
<div class="cap"><span id="n"></span><b id="t"></b><div class="sw" id="s"></div></div>
<div class="mon">
 <div class="bezel">
  <div class="screen">
   <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
    <div class="tabt"><em></em>Tawhid Auto Rice Mill — Zinia™</div>
    <div class="url">🔒 tawhidautoricemill.com</div></div>
   <img class="shot" id="img">
  </div>
  <div class="chin">TAWHID</div>
 </div>
 <div class="neck"></div><div class="base"></div>
</div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('img').src=q.get('img');
document.getElementById('t').textContent=q.get('t');
document.getElementById('n').textContent=q.get('n');
(q.get('s')||'').split(',').filter(Boolean).forEach(c=>{const i=document.createElement('i');i.style.background='#'+c;document.getElementById('s').appendChild(i)});
</script>
</body></html>
